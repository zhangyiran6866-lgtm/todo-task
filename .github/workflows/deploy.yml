name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: true
          progress: plain
          tags: |
            ${{ env.IMAGE_PREFIX }}/todotask-frontend:latest
            ${{ env.IMAGE_PREFIX }}/todotask-frontend:${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./packages/backend
          file: ./packages/backend/Dockerfile
          push: true
          progress: plain
          tags: |
            ${{ env.IMAGE_PREFIX }}/todotask-backend:latest
            ${{ env.IMAGE_PREFIX }}/todotask-backend:${{ github.sha }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            export DOCKER_CLIENT_TIMEOUT=600
            export COMPOSE_HTTP_TIMEOUT=600
            cd /opt/todotask

            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            fi

            attempt=1
            until [ "$attempt" -gt 3 ]
            do
              echo "Pull attempt ${attempt}/3"
              if docker compose -f docker-compose.prod.yml pull frontend backend mongo; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Pull failed after 3 attempts"
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 20
            done

            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
